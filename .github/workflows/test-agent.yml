# Unit test agent.
#
# pull_request:       write tests for the source files changed in the PR,
#                     commit them to the PR branch, comment with the results.
# workflow_dispatch:  "backfill" - add missing tests for the whole project
#                     and open a new PR with them.
#
# The agent only writes files. Everything that decides the outcome - which
# files to test, whether the agent stayed inside test files, whether the tests
# pass, what gets committed - is done by the steps below, not by the model.

name: Test agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/app/**"
      - "frontend/src/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill: add missing tests for every source file"
        type: choice
        options: [backfill]
        default: backfill

# Nothing by default; the job asks only for what it needs.
permissions: {}

# One run per PR. A new push cancels the run for the previous one.
concurrency:
  group: test-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-agent:
    # PRs from forks get no secrets and must not run the agent.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # push the new tests
      pull-requests: write  # comment on the PR, open the backfill PR

    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && 'backfill' || 'pr' }}
      MAX_TURNS: ${{ github.event_name == 'workflow_dispatch' && '200' || '60' }}
      # Branch and base are user-controlled text: pass them only through env,
      # never with ${{ }} inside a run script.
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out the PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0              # needed for git diff base...head
          persist-credentials: false  # the agent's shell gets no GitHub token

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend

      - name: Find source files to test
        id: context
        run: |
          python -m tools.changed_files --mode "$MODE" --base "origin/$BASE_BRANCH" --head HEAD
          count=$(python -c "import json; print(len(json.load(open('.agent/context.json'))['files']))")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.context.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: Run the test-writer agent
        id: agent
        if: steps.context.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 30
        env:
          # The only step that gets the secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Write unit tests for the files in .agent/context.json and save the report to .agent/report.json." \
            --agent test-writer \
            --settings .github/test-agent/claude-settings.json \
            --permission-mode dontAsk \
            --max-turns "$MAX_TURNS" \
            --output-format json \
            > .agent/claude-output.json

      # Independent of the agent's own permissions: fail if it changed
      # anything other than test files.
      - name: Check the agent changed only test files
        id: guard
        if: always() && steps.context.outputs.count != '0'
        run: python -m tools.guard_paths

      # The results in the PR come from these runs, not from the agent's report.
      - name: Run backend tests
        id: backend
        if: always() && steps.context.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=json

      - name: Run frontend tests
        id: frontend
        if: always() && steps.context.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Save the agent's changes
        if: always()
        run: |
          mkdir -p .agent
          # New test files are untracked; mark them so git diff includes them.
          git add --intent-to-add backend/tests frontend/src
          git diff > .agent/tests.patch

      - name: Upload agent files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-agent-${{ github.run_id }}
          path: .agent/
          include-hidden-files: true
          if-no-files-found: ignore

      # Commit only when: the guard passed, both suites pass, and there is
      # something new. Otherwise the tests stay in the artifact only.
      - name: Commit new tests
        id: commit
        if: >-
          steps.guard.outcome == 'success' &&
          steps.backend.outcome == 'success' &&
          steps.frontend.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git add backend/tests frontend/src
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "test-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add unit tests generated by the test agent"

          if [ "$MODE" = "backfill" ]; then
            target="test-agent/backfill-${GITHUB_RUN_ID}"
          else
            target="$HEAD_BRANCH"
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${target}"

          if [ "$MODE" = "backfill" ]; then
            url=$(gh pr create --base "$BASE_BRANCH" --head "$target" \
              --title "Add missing unit tests (test agent backfill)" \
              --body "Tests generated by the test agent, run ${GITHUB_RUN_ID}. Results are in the comment below.")
            echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Build the results comment
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m tools.coverage_report > .agent/comment.md
          cat .agent/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: always() && (env.PR_NUMBER != '' || steps.commit.outputs.pr != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ env.PR_NUMBER || steps.commit.outputs.pr }}
        run: gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body-file .agent/comment.md

      - name: Fail the run if a check failed
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          for outcome in "$AGENT_OUTCOME" "$GUARD_OUTCOME" "$BACKEND_OUTCOME" "$FRONTEND_OUTCOME"; do
            if [ "$outcome" = "failure" ]; then
              echo "At least one step failed, see the PR comment."
              exit 1
            fi
          done
